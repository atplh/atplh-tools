<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calculators, simulators and study resources for the EASA ATPL(H) theory exams." />
    <link rel="icon" type="image/svg+xml" href="./atplh-tools-rotor.svg" />
    <title>ATPL(H) Tools</title>
    <style>
      :root {
        --bg: #0a131e;
        --surface: #0f1b29;
        --surface-hover: #142335;
        --line: #1f3145;
        --line-strong: #2c4258;
        --text: #e8eef5;
        --muted: #8fa1b4;
        --faint: #5d7086;
        --accent: #efc36a;
        --accent-soft: rgba(239, 195, 106, 0.1);
        --radius: 10px;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; scroll-padding-top: 24px; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 system-ui, "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a { color: inherit; text-decoration: none; }
      a:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .page {
        max-width: 1080px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }

      /* ---------- Header ---------- */
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .logo {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        flex: 0 0 auto;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }

      .brand p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .search {
        position: relative;
        margin-left: auto;
        width: min(320px, 100%);
      }

      .search svg {
        position: absolute;
        left: 12px;
        top: 50%;
        width: 16px;
        height: 16px;
        transform: translateY(-50%);
        color: var(--faint);
        pointer-events: none;
      }

      .search input {
        width: 100%;
        padding: 10px 40px 10px 36px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      .search input::placeholder { color: var(--faint); }

      .search kbd {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        padding: 1px 7px;
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        color: var(--faint);
        font: 12px/1.5 ui-monospace, Consolas, monospace;
      }

      /* ---------- Quick access ---------- */
      .quick {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
        margin-top: 32px;
      }

      .quick a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        transition: background 0.15s, border-color 0.15s;
      }

      .quick a:hover { background: var(--surface-hover); border-color: var(--line-strong); }

      .quick .glyph {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--accent-soft);
        font-size: 1.05rem;
        flex: 0 0 auto;
      }

      .quick strong { display: block; font-size: 0.92rem; font-weight: 600; }
      .quick small { display: block; color: var(--muted); font-size: 0.8rem; }

      /* ---------- Layout ---------- */
      .layout {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 40px;
        margin-top: 40px;
      }

      /* Subject index */
      nav.index {
        position: sticky;
        top: 24px;
        align-self: start;
      }

      .label {
        margin: 0 0 10px;
        color: var(--faint);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      nav.index ul { list-style: none; margin: 0; padding: 0; }

      nav.index a,
      nav.index span.item {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        align-items: center;
        padding: 5px 8px;
        border-radius: 6px;
        font-size: 0.88rem;
      }

      nav.index a { color: var(--text); }
      nav.index a:hover { background: var(--surface); }
      nav.index span.item { color: var(--faint); }

      nav.index .code {
        color: var(--faint);
        font: 12px ui-monospace, Consolas, monospace;
      }

      nav.index a .code { color: var(--accent); }

      nav.index .count {
        min-width: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--surface-hover);
        color: var(--muted);
        font-size: 0.75rem;
        text-align: center;
      }

      /* Subject sections */
      section.subject + section.subject { margin-top: 32px; }

      .subject-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }

      .subject-head .code {
        color: var(--accent);
        font: 600 0.82rem ui-monospace, Consolas, monospace;
      }

      .subject-head h2 {
        margin: 0;
        font-size: 1.08rem;
        font-weight: 600;
      }

      .tools { list-style: none; margin: 0; padding: 0; }

      .tool {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto 16px;
        align-items: center;
        gap: 16px;
        padding: 12px 10px;
        margin: 0 -10px;
        border-bottom: 1px solid var(--line);
        border-radius: 6px;
        transition: background 0.15s;
      }

      .tool:hover { background: var(--surface); }
      .tool:hover .arrow { color: var(--accent); transform: translateX(2px); }

      .tool-title { font-weight: 600; }

      .tool-topic {
        margin-left: 8px;
        color: var(--faint);
        font-size: 0.82rem;
        font-weight: 400;
      }

      .tool-desc {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .tag {
        padding: 2px 8px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.74rem;
        white-space: nowrap;
      }

      .arrow {
        color: var(--faint);
        transition: color 0.15s, transform 0.15s;
      }

      .empty {
        display: none;
        padding: 40px 0;
        color: var(--muted);
        text-align: center;
      }

      footer {
        margin-top: 56px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font-size: 0.82rem;
      }

      /* ---------- Responsive ---------- */
      @media (max-width: 900px) {
        .layout { grid-template-columns: minmax(0, 1fr); gap: 28px; }
        nav.index { position: static; }
        nav.index ul { display: flex; flex-wrap: wrap; gap: 6px; }
        nav.index li.soon { display: none; }
        nav.index a {
          display: inline-flex;
          gap: 6px;
          padding: 5px 10px;
          border: 1px solid var(--line);
          border-radius: 999px;
        }
      }

      @media (max-width: 560px) {
        .page { padding: 24px 16px 48px; }
        .search { width: 100%; margin-left: 0; }
        .search kbd { display: none; }
        .quick { grid-template-columns: minmax(0, 1fr); }
        .tool { grid-template-columns: minmax(0, 1fr) 16px; }
        .tool .tag { display: none; }
        .tool-topic { display: block; margin-left: 0; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <img class="logo" src="./atplh-tools-rotor.svg" alt="" />
        <div class="brand">
          <h1>ATPL(H) Tools</h1>
          <p>Calculators, simulators and study resources for the EASA ATPL(H) theory exams.</p>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search tools…" autocomplete="off" aria-label="Search tools" />
          <kbd>/</kbd>
        </label>
      </header>

      <div class="quick" id="quick" aria-label="Quick access"></div>

      <div class="layout">
        <nav class="index" aria-label="Subjects">
          <p class="label">Subjects</p>
          <ul id="index"></ul>
        </nav>

        <main>
          <div id="subjects"></div>
          <p class="empty" id="empty">No tools match your search.</p>
        </main>
      </div>

      <footer>
        Study aids only. Always verify current official aeronautical information before flight.
      </footer>
    </div>

    <script>
      /* ------------------------------------------------------------------
         To add a tool: append one entry to TOOLS with the subject code.
         Subjects with no tools appear greyed out in the index.
         ------------------------------------------------------------------ */
      const SUBJECTS = [
        // { code: "010", name: "Air Law" },
        { code: "021", name: "Aircraft General Knowledge" },
        { code: "022", name: "Instrumentation" },
        // { code: "031", name: "Mass & Balance" },
        { code: "033", name: "Flight Planning" },
        // { code: "034", name: "Performance" },
        // { code: "040", name: "Human Performance" },
        { code: "050", name: "Meteorology" },
        { code: "061", name: "General Navigation" },
        { code: "062", name: "Radio Navigation" },
        // { code: "070", name: "Operational Procedures" },
        { code: "082", name: "Principles of Flight" },
        { code: "090", name: "Communications" },
      ];

      const TOOLS = [
        // 021 AGK
        { subject: "021", topic: "Systems", title: "Helicopter system map", desc: "Avionics and flight-instrument interconnections.", type: "Interactive", href: "./tools/agk/systems/helicopter-system-map.html" },
        { subject: "021", topic: "Engines", title: "Float carburettor", desc: "Venturi, float chamber and cockpit controls, step by step.", type: "Simulator", href: "./tools/agk/engines/float-carburettor.html" },
        { subject: "021", topic: "Electrics", title: "Three-phase induction motor", desc: "How an AC induction motor works.", type: "Simulator", href: "./tools/agk/electrics/three-phase-induction.html" },
        { subject: "021", topic: "Electrics", title: "Logic gates", desc: "Practice quiz on gates and truth tables.", type: "Quiz", href: "./tools/agk/electrics/logic-gates.html" },
        // 022 Instrumentation
        { subject: "022", topic: "Pitot-static", title: "Pitot-static failures", desc: "Block the pitot, drain or static ports and watch the ASI, altimeter and VSI.", type: "Simulator", href: "./tools/instruments/pitot-static.html" },
        // 033 Flight planning
        { subject: "033", title: "ICAO flight plan", desc: "Field-by-field guide to filling in an ICAO flight plan.", type: "Guide", href: "./tools/flight-planning/icao-flight-plan.html" },
        // 050 Meteo
        { subject: "050", title: "Altimetry simulator", desc: "Altimeter settings and readings for helicopter operations.", type: "Simulator", href: "./tools/meteo/altimetry-simulator.html" },
        { subject: "050", title: "Front simulator", desc: "Frontal systems and their associated weather.", type: "Simulator", href: "./tools/meteo/meteo-fronts.html" },
        { subject: "050", title: "Wind simulator", desc: "Geostrophic wind: when it veers, backs, strengthens or weakens.", type: "Simulator", href: "./tools/meteo/wind-simulator.html" },
        { subject: "050", title: "METAR & TAF decoder", desc: "Paste a METAR or TAF and every group is explained, colour-coded. Includes exam-style practice.", type: "Decoder", href: "./tools/meteo/metar-taf-decoder.html" },
        // 061 General navigation
        { subject: "061", title: "GNAV calculations", desc: "Departure, convergency and conversion angle, rhumb line vs great circle, chart convergence, scale and arc to time. Shows the working, with quiz mode.", type: "Calculator", href: "./tools/gnav/gnav-calculations.html" },
        { subject: "061", title: "Wind triangle", desc: "Heading, groundspeed and drift for a track, or find the wind. Shows the working.", type: "Calculator", href: "./tools/gnav/wind-triangle.html" },
        // 062 Radio nav
        { subject: "062", title: "VOR, ADF and RMI", desc: "Move the helicopter and read the RMI, ADF and VOR indicator. Includes practice questions.", type: "Simulator", href: "./tools/rnav/vor-adf-rmi.html" },
        { subject: "062", title: "Radio-navigation aids", desc: "NDB/ADF, VOR, DME, ILS, marker beacons and MLS.", type: "Guide", href: "./tools/rnav/radionavigation-aids.html" },
        // 082 POF
        // 090 Communications
        { subject: "090", title: "Comms reference", desc: "Squawk codes, distress, radio failure, light signals, read-backs and standard words. Includes a quiz.", type: "Reference", href: "./tools/comms/comms-reference.html" },
        { subject: "082", title: "Rotor dynamics simulator", desc: "Live rotor: feathering, coning, flapping, lead-lag, phase lag, flapback, transverse flow, ETL and retreating blade stall.", type: "Simulator", href: "./tools/principles-of-flight/rotor-dynamics.html" },
        { subject: "082", title: "Hinge offset explainer", desc: "How rotor hinge offset affects helicopter flight.", type: "Explainer", href: "./tools/principles-of-flight/hinge-offset.html" },
      ];

      const QUICK = [
        { glyph: "🧮", title: "SENASA calculator", sub: "Exam calculator", href: "./tools/general/calculadora_senasa.html" },
        { glyph: "📏", title: "CRP-5", sub: "Flight computer ↗", href: "https://crp5.florian-scheuner.de/", external: true },
        // Hidden for now — uncomment to show again
        // { glyph: "🏛️", title: "AESA question banks", sub: "Official · Spain ↗", href: "https://www.seguridadaerea.gob.es/en/ambitos/formacion-y-examenes/examenes-de-piloto/examenes-teoricos/bancos-de-preguntas", external: true },
        // { glyph: "🇪🇺", title: "EASA ECQB", sub: "Official · Europe ↗", href: "https://www.easa.europa.eu/en/domains/aircrew-and-medical/european-central-question-bank-ecqb", external: true },
      ];

      const esc = (s = "") => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const ext = (item) => (item.external ? ' target="_blank" rel="noopener noreferrer"' : "");
      const byCode = (code) => TOOLS.filter((t) => t.subject === code);

      document.getElementById("quick").innerHTML = QUICK.map((q) => `
        <a href="${q.href}"${ext(q)}>
          <span class="glyph" aria-hidden="true">${q.glyph}</span>
          <span><strong>${esc(q.title)}</strong><small>${esc(q.sub)}</small></span>
        </a>`).join("");

      document.getElementById("index").innerHTML = SUBJECTS.map((s) => {
        const n = byCode(s.code).length;
        return n
          ? `<li><a href="#s-${s.code}"><span class="code">${s.code}</span><span>${esc(s.name)}</span><span class="count">${n}</span></a></li>`
          : `<li class="soon"><span class="item" title="Coming soon"><span class="code">${s.code}</span><span>${esc(s.name)}</span></span></li>`;
      }).join("");

      const container = document.getElementById("subjects");
      container.innerHTML = SUBJECTS.filter((s) => byCode(s.code).length).map((s) => `
        <section class="subject" id="s-${s.code}">
          <div class="subject-head"><span class="code">${s.code}</span><h2>${esc(s.name)}</h2></div>
          <ul class="tools">
            ${byCode(s.code).map((t) => `
              <li><a class="tool" href="${t.href}"${ext(t)} data-search="${esc([t.title, t.desc, t.topic, t.type, s.name, s.code].join(" ").toLowerCase())}">
                <span>
                  <span class="tool-title">${esc(t.title)}</span>${t.topic ? `<span class="tool-topic">${esc(t.topic)}</span>` : ""}
                  <span class="tool-desc">${esc(t.desc)}</span>
                </span>
                <span class="tag">${esc(t.type)}</span>
                <span class="arrow" aria-hidden="true">→</span>
              </a></li>`).join("")}
          </ul>
        </section>`).join("");

      // Search
      const input = document.getElementById("q");
      const empty = document.getElementById("empty");
      input.addEventListener("input", () => {
        const terms = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
        let visible = 0;
        container.querySelectorAll("section.subject").forEach((sec) => {
          let shown = 0;
          sec.querySelectorAll("a.tool").forEach((a) => {
            const match = terms.every((term) => a.dataset.search.includes(term));
            a.parentElement.hidden = !match;
            shown += match;
          });
          sec.hidden = !shown;
          visible += shown;
        });
        empty.style.display = visible ? "none" : "block";
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement !== input) {
          e.preventDefault();
          input.focus();
        } else if (e.key === "Escape" && document.activeElement === input) {
          input.value = "";
          input.dispatchEvent(new Event("input"));
          input.blur();
        }
      });
    </script>
  </body>
</html>
